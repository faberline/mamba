name: q0-159-ruff-reference

on:
  push:
    branches: [codex/q0-159-ruff-reference]

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record source and host
        run: |
          mkdir receipts
          {
            git rev-parse HEAD 'HEAD^{tree}'
            uname -a
            printf 'run=%s attempt=%s\n' '${{ github.run_id }}' '${{ github.run_attempt }}'
            sha256sum Cargo.lock crates/mamba-quality/assets/profile.json tools/ci/q0_ruff*.py tools/ci/q0_ruff_reference_lock.json
          } > receipts/source.txt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        id: python312
        with:
          python-version: '3.12.11'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        id: python313
        with:
          python-version: '3.13.5'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        id: python314
        with:
          python-version: '3.14.0'
      - name: Receipt and input negative controls
        run: |
          python -B - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('tools/ci', pattern='test_q0_ruff*.py')
          if suite.countTestCases() == 0:
              raise SystemExit('No receipt/input controls were discovered')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Run the fixed Ruff reference inputs on all three Python targets
        run: |
          python -B tools/ci/q0_ruff_reference.py --output receipts/run \
            --python312 '${{ steps.python312.outputs.python-path }}' \
            --python313 '${{ steps.python313.outputs.python-path }}' \
            --python314 '${{ steps.python314.outputs.python-path }}'
      - name: Keep raw results on success and failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: q0-159-ruff-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            receipts/
            !receipts/run/python3*/venv/**
          if-no-files-found: error
          retention-days: 14
