name: mamba-ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# PR updates cancel only that PR's obsolete run; manual runs are independent.
concurrency:
  group: mamba-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: linux / ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        suite: [library-baseline, contracts]
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      RUST_TEST_THREADS: 1
      RAYON_NUM_THREADS: 1
      CARGO_TERM_COLOR: never
      CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.11'
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.0 --profile minimal && rustup default 1.97.0
      # Cache downloaded dependencies only. Test binaries are built for this head.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: mamba-ci-${{ runner.os }}-${{ runner.arch }}-rust1.97.0-${{ hashFiles('Cargo.lock') }}
      - name: Record tool and source identity
        run: |
          mkdir -p receipts
          {
            git rev-parse HEAD 'HEAD^{tree}'
            rustc -Vv
            cargo -V
            python -VV
            uname -a
            sha256sum Cargo.lock Cargo.toml .cargo/config.toml
          } > receipts/environment.txt
          cargo metadata --locked --no-deps --format-version 1 > receipts/cargo-targets.json
      - name: Receipt parser negative controls
        run: python -m unittest discover -s tools/ci -p 'test_test_receipt.py' -v
      - name: Independent Linux ABI and pinned CPython controls
        run: |
          cc --version > receipts/c-compiler.txt
          cc -std=c11 -Wall -Wextra -Werror tools/ci/libc_abi_probe.c -o "$RUNNER_TEMP/mamba-libc-abi"
          "$RUNNER_TEMP/mamba-libc-abi" > receipts/libc-abi.json
          python - <<'PY'
          import json, select, socket
          with open('receipts/libc-abi.json') as stream:
              actual = json.load(stream)
          assert actual['linux'] is True
          assert actual['pollmsg'] == select.POLLMSG == 0x0400
          assert (actual['ipv6_host'], actual['ipv6_service']) == socket.getnameinfo(
              ('::1', 443, 0, 0), socket.NI_NUMERICHOST | socket.NI_NUMERICSERV)
          PY
      - name: Test complete library baseline
        if: matrix.suite == 'library-baseline'
        run: python tools/ci/test_receipt.py lib --output receipts/lib --timeout 2400
      - name: Test explicit contracts
        if: matrix.suite == 'contracts'
        shell: bash
        run: |
          status=0
          for target in perf_pin_gate_policy conformance_contract; do
            python tools/ci/test_receipt.py "$target" --output "receipts/$target" --inventory-timeout 2400 --timeout 1200 || status=1
          done
          exit "$status"
      - name: Retain raw results even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mamba-ci-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipts/
          if-no-files-found: error
          retention-days: 14
