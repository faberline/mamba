name: q0-164-pydantic-reference

on:
  push:
    branches: [codex/q0-164-pydantic-reference]

permissions:
  contents: read

jobs:
  reference:
    name: twelve-independent-api-children
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record the source and fresh host
        shell: bash
        run: |
          python3 -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import subprocess
          import sys
          commands = []
          for argv in (["git", "rev-parse", "HEAD"], ["git", "rev-parse", "HEAD^{tree}"],
                       ["git", "status", "--porcelain=v1", "-uall"], ["uname", "-a"]):
              result = subprocess.run(argv, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              commands.append({"argv": argv, "cwd": str(Path.cwd()), "wait_completed": True,
                               "actual_exit": result.returncode, "stdout": result.stdout.decode(),
                               "stderr": result.stderr.decode()})
              result.check_returncode()
          if commands[2]["stdout"]:
              raise SystemExit("source checkout has uncommitted changes")
          lock = json.loads(Path("tools/ci/q0_pydantic_reference_lock.json").read_bytes())
          paths = {*(Path(name) for name in lock["source_files"]),
                   Path(".github/workflows/q0-164-pydantic-reference.yml"),
                   *Path("tools/ci").glob("q0_*.py"),
                   *Path("tools/ci").glob("test_q0_pydantic*.py"),
                   Path("tools/ci/q0_pydantic_reference_lock.json")}
          files = {str(p): {"bytes": p.stat().st_size,
                           "sha256": hashlib.sha256(p.read_bytes()).hexdigest()}
                   for p in sorted(paths) if p.is_file()}
          record = {"commands": commands, "files": files, "control_python": sys.version,
                    "control_executable": sys.executable, "sys_platform": sys.platform,
                    "machine": platform.machine(), "platform": platform.platform(),
                    "host": {k: os.environ.get(k) for k in ("RUNNER_OS", "RUNNER_ARCH", "ImageOS",
                             "ImageVersion", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_SHA")}}
          Path("receipts").mkdir()
          Path("receipts/source.json").write_text(json.dumps(record, indent=2) + "\n")
          PY
      - name: Run only the capture helper controls
        shell: bash
        run: |
          python3 -B - <<'PY' > receipts/controls.stdout 2> receipts/controls.stderr
          import sys
          import unittest
          sys.path.insert(0, "tools/ci")
          suite = unittest.TestSuite()
          for name in ("test_q0_pydantic_inputs", "test_q0_pydantic_collectors", "test_q0_pydantic_reference", "test_q0_pydantic_python"):
              tests = unittest.defaultTestLoader.loadTestsFromName(name)
              if tests.countTestCases() == 0:
                  raise SystemExit("zero helper controls in " + name)
              suite.addTests(tests)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Prepare exact Python 3.12.11
        id: py312
        shell: bash
        run: |
          python3 -B tools/ci/q0_pydantic_python.py \
            --repository "$GITHUB_WORKSPACE" --output "$GITHUB_WORKSPACE/receipts/bootstrap-312" \
            --prefix "$RUNNER_TEMP/q0-pydantic-python312" --python-version 3.12.11
      - name: Prepare exact Python 3.13.5
        id: py313
        shell: bash
        run: |
          python3 -B tools/ci/q0_pydantic_python.py \
            --repository "$GITHUB_WORKSPACE" --output "$GITHUB_WORKSPACE/receipts/bootstrap-313" \
            --prefix "$RUNNER_TEMP/q0-pydantic-python313" --python-version 3.13.5
      - name: Prepare exact Python 3.14.0
        id: py314
        shell: bash
        run: |
          python3 -B tools/ci/q0_pydantic_python.py \
            --repository "$GITHUB_WORKSPACE" --output "$GITHUB_WORKSPACE/receipts/bootstrap-314" \
            --prefix "$RUNNER_TEMP/q0-pydantic-python314" --python-version 3.14.0
      - name: Run all four asset families in twelve original API children
        shell: bash
        run: |
          python3 -B tools/ci/q0_pydantic_reference.py \
            --repository "$GITHUB_WORKSPACE" --output "$GITHUB_WORKSPACE/receipts/run" \
            --python312 '${{ steps.py312.outputs.python-path }}' \
            --python313 '${{ steps.py313.outputs.python-path }}' \
            --python314 '${{ steps.py314.outputs.python-path }}'
      - name: Retain raw evidence on success and failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: q0-164-pydantic-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            receipts/
            !receipts/run/python3*/venv/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
